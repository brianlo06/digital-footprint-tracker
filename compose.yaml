services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: footprint
      POSTGRES_USER: footprint
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footprint -d footprint"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - footprint_postgres:/var/lib/postgresql/data

volumes:
  footprint_postgres:
